[project]
name = "coldchain-schemas"
version = "0.1.0"
description = "Shared event schemas for ColdChain AI"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_schemas"]
