[project]
name = "coldchain-ml-api"
version = "0.1.0"
description = "Model-serving API for ColdChain AI (anomaly detection, breach early warning)"
requires-python = ">=3.12"
dependencies = [
    "coldchain-ml",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "prometheus-client>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_ml_api"]
