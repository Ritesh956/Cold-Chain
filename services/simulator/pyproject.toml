[project]
name = "coldchain-simulator"
version = "0.1.0"
description = "Synthetic freezer-sensor simulator with labelled fault injection"
requires-python = ">=3.12"
dependencies = [
    "coldchain-schemas",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
]

[project.optional-dependencies]
live = ["nats-py>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_simulator"]
