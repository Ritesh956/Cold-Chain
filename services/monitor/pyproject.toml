[project]
name = "coldchain-monitor"
version = "0.1.0"
description = "Drift monitor for ColdChain AI: input drift on live readings, prediction drift on model scores"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "prometheus-client>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_monitor"]
