# One-command local stack:  docker compose --profile core up -d
# Profiles keep a 16 GB laptop comfortable: `core` = data plane + MLflow.
# `ml` adds the model API (register models first, see README). `app` adds core and the dashboard (http://localhost:3000); `sim` adds the live
# SYNTHETIC sensor simulator. Everything:  docker compose --profile core --profile ml --profile app --profile sim up -d
# `observability` adds the drift monitor, Prometheus and Grafana (start it with `ml` and `app`); `vision` comes later.
name: coldchain

x-env: &env
  env_file: [.env]

services:
  nats:
    image: nats:2.10-alpine
    profiles: [core]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: [core]
    <<: *env
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/compose/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [core]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: [core]
    <<: *env
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: [core]
    <<: *env
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/mlflow local/vision local/datasets"

  mlflow:
    build: ./infra/mlflow
    profiles: [core]
    <<: *env
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
    ports: ["5000:5000"]

  ml-api:
    build:
      context: .
      dockerfile: services/ml-api/Dockerfile
    profiles: [ml]
    depends_on:
      mlflow: {condition: service_started}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # models:/<name>@<alias>; move the alias in the MLflow registry to roll out or roll back
      ANOMALY_MODEL_URI: models:/coldchain-anomaly@champion
      BREACH_MODEL_URI: models:/coldchain-breach@champion
    restart: on-failure  # fails fast if the registry has no champion yet
    ports: ["8080:8080"]

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    profiles: [app]
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    <<: *env
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://ml-api:8080
      SCORE_EVERY_MIN: "5"   # event minutes between scoring calls (the simulator replays at 60x)
    restart: on-failure
    ports: ["8000:8080"]

  dashboard:
    build:
      context: ./dashboard
      args:
        CORE_URL: http://core:8080
        MONITOR_URL: http://monitor:8080
    profiles: [app]
    depends_on: [core]
    ports: ["3000:3000"]

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    profiles: [sim]
    depends_on:
      nats: {condition: service_healthy}
    environment:
      NATS_URL: nats://nats:4222
      SPEEDUP: "60"

  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    profiles: [observability]
    environment:
      CORE_URL: http://core:8080
      ML_API_URL: http://ml-api:8080
    restart: on-failure
    ports: ["8090:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes: ["./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # local development only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

volumes:
  nats-data:
  pg-data:
  minio-data:
