name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose --profile core config -q

  docker-ml-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ml-api image
        run: docker build -f services/ml-api/Dockerfile -t coldchain-ml-api:ci .
      - name: Smoke test (imports, runs as non-root)
        run: |
          docker run --rm coldchain-ml-api:ci python -c "import coldchain_ml_api.app, lightgbm, mlflow; print('ok')"
          test "$(docker run --rm coldchain-ml-api:ci id -u)" != "0"
