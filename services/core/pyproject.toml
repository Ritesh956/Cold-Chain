[project]
name = "coldchain-core"
version = "0.1.0"
description = "Ingest, history, scoring orchestration, alerts and API for ColdChain AI"
requires-python = ">=3.12"
dependencies = [
    "coldchain-schemas",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.27,<1",
    "nats-py>=2.9,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5,<6",
    "prometheus-client>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_core"]
