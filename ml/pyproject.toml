[project]
name = "coldchain-ml"
version = "0.1.0"
description = "Training and evaluation code for ColdChain AI models"
requires-python = ">=3.12"
dependencies = [
    "coldchain-simulator",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "mlflow-skinny>=2.17,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain_ml"]
