[project]
name = "coldchain-ai"
version = "0.1.0"
description = "ColdChain AI: AI control tower for an automated cold store (workspace root)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "httpx>=0.27", "fakeredis>=2.26", "pytest-asyncio>=0.24", "coldchain-ml[train]"]

# Opt-in, heavy (PyTorch): `uv sync --all-packages --group nlp`. CI does not install it.
nlp = ["torch>=2.4,<3", "transformers>=4.45,<5", "onnx>=1.17", "onnxruntime>=1.20", "safetensors>=0.4"]

[tool.uv.workspace]
members = ["libs/*", "services/simulator", "services/ml-api", "services/core", "services/monitor", "ml"]

[tool.uv.sources]
coldchain-schemas = { workspace = true }
coldchain-simulator = { workspace = true }
coldchain-ml = { workspace = true }
coldchain-ml-api = { workspace = true }
coldchain-core = { workspace = true }
coldchain-monitor = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# a hand-written dataset and experiment printouts: long lines are intrinsic
"ml/src/coldchain_ml/nlp/independent.py" = ["E501"]
"ml/src/coldchain_ml/nlp/compare.py" = ["E501"]
"ml/src/coldchain_ml/nlp/export.py" = ["E501"]
"ml/src/coldchain_ml/nlp/report.py" = ["E501"]
"ml/src/coldchain_ml/registry/promote_incident.py" = ["E501"]
"scripts/osha_check.py" = ["E501"]  # prose lines of the generated report
"ml/src/coldchain_ml/forecast/run.py" = ["E501"]  # prose lines of the generated report
"ml/src/coldchain_ml/slotting/run.py" = ["E501"]  # prose lines of the generated report

[tool.pytest.ini_options]
testpaths = ["services", "libs", "ml", "tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["services/core/tests", "services/ml-api/tests"]
asyncio_mode = "auto"
markers = ["integration: needs real Postgres/Redis/NATS (set DATABASE_URL, REDIS_URL, NATS_URL)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
